name: Testar cadastro de alunos e turmas

on:
  push:
    branches: [ main ]
    paths:
      - 'aluno.py'
      - 'turma.py'
      - 'main.py'
      - 'testes.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Executar testes
        run: python testes.py
